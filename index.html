ntent=e.dataset[lang]);document.getElementById('en').classList.toggle('active',lang==='en');document.getElementById('zh').classList.toggle('active',lang==='zh');const grid=document.getElementById('projectsGrid');grid.innerHTML='';P.forEach((p,i)=>{const el=document.createElement('article');el.className='card';const tag=document.createElement('div');tag.className='tag';tag.textContent=p[2];const h=document.createElement('h3');h.textContent=p[lang==='en'?1:0];const d=document.createElement('p');d.textContent=lang==='en'?'Source materials catalogued · publication details pending':'已收录源资料 · 公开展示信息待核实';el.append(tag,h,d);grid.appendChild(el)})}document.getElementById('en').onclick=()=>{lang='en';render()};document.getElementById('zh').onclick=()=>{lang='zh';render()};render()</script></body></html>
